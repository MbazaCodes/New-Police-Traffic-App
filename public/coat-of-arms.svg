<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5c1a"/>
      <stop offset="100%" stop-color="#0d4f3c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M100 20 L160 50 L160 120 Q160 170 100 180 Q40 170 40 120 L40 50 Z" 
        fill="url(#shieldGrad)" stroke="#DAA520" stroke-width="3"/>
  <!-- Inner shield decoration -->
  <path d="M100 35 L145 60 L145 115 Q145 160 100 170 Q55 160 55 115 L55 60 Z" 
        fill="none" stroke="#DAA520" stroke-width="1.5"/>
  <!-- Torch flame -->
  <ellipse cx="100" cy="70" rx="15" ry="25" fill="#FFD700" opacity="0.9"/>
  <ellipse cx="100" cy="65" rx="8" ry="15" fill="#FF6347" opacity="0.7"/>
  <!-- Spear left -->
  <line x1="60" y1="30" x2="60" y2="150" stroke="#DAA520" stroke-width="2"/>
  <polygon points="60,25 55,35 65,35" fill="url(#goldGrad)"/>
  <!-- Spear right -->
  <line x1="140" y1="30" x2="140" y2="150" stroke="#DAA520" stroke-width="2"/>
  <polygon points="140,25 135,35 145,35" fill="url(#goldGrad)"/>
  <!-- Axe -->
  <line x1="170" y1="60" x2="170" y2="140" stroke="#DAA520" stroke-width="2"/>
  <path d="M170 60 Q180 50 175 65 Q180 55 170 60" fill="url(#goldGrad)"/>
  <!-- Shield emblem -->
  <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="18" fill="#DAA520" font-weight="bold">TZ</text>
  <!-- Border text -->
  <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#0d4f3c" font-weight="bold">TANZANIA</text>
</svg>